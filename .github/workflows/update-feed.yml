name: Update FeedPulse AI feed

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate RSS briefings with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          MAX_ITEMS: 20
          MAX_AGE_DAYS: 7
          BATCH_SIZE: 10
          INTER_BATCH_DELAY_MS: 8000
        run: node pipeline/update-feed.mjs

      - name: Commit generated feed
        run: |
          git config user.name 'FeedPulse AI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add site/feed.json site/feed-state.json
          git diff --cached --quiet || git commit -m "Update AI news feed"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload generated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy generated feed
        id: deployment
        uses: actions/deploy-pages@v4
